<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentación</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
  }
  #viewer{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  #viewer.with-bg{
    background:#000 url('assets/fondo.gif') center/cover no-repeat;
  }
  #viewer img{
    width:100%;
    height:100%;
    border:none;
    object-fit:contain;
    background:#000;
  }
  #viewer canvas{
    max-width:100%;
    max-height:100%;
  }

  /* Video: centrado, tamaño moderado por defecto; al hacer clic ocupa
     toda la pantalla salvo el alto de las flechas de navegación */
  #viewer video{
    max-width:88%;
    max-height:78vh;
    border:none;
    object-fit:contain;
    background:#000;
    cursor:pointer;
    transition:max-width .2s ease, max-height .2s ease;
  }
  #viewer video.expanded{
    width:100vw;
    max-width:100vw;
    height:calc(100vh - 96px);
    max-height:calc(100vh - 96px);
  }
  #empty-msg{
    color:#8b949e;
    font-size:1.2em;
    text-align:center;
    padding:20px;
  }

  /* Versión de la página */
  #version{
    position:fixed;
    bottom:6px;
    left:8px;
    color:rgba(255,255,255,.35);
    font-size:10px;
    user-select:none;
    z-index:10;
  }

  /* Contador de diapositiva */
  #counter{
    position:fixed;
    bottom:24px;
    left:24px;
    color:#fff;
    background:rgba(0,0,0,.5);
    padding:6px 14px;
    border-radius:20px;
    font-size:14px;
    user-select:none;
    z-index:10;
  }

  /* Flechas de navegación, esquina inferior derecha, siempre sobre la diapositiva */
  #nav{
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    gap:10px;
    z-index:10;
  }
  .nav-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:1.4em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .1s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,.15); }
  .nav-btn:active{ transform:scale(0.92); }
  .nav-btn:disabled{
    opacity:.3;
    cursor:default;
  }
  .nav-btn:disabled:hover{ background:rgba(0,0,0,.55); }

  /* Botón de pantalla completa, esquina superior derecha */
  #fullscreen-btn{
    position:fixed;
    top:16px;
    right:16px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.45);
    color:#fff;
    font-size:1.1em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:background .15s;
  }
  #fullscreen-btn:hover{ background:rgba(255,255,255,.15); }

  /* Diapositiva con juego de tarjetas sobre una foto de fondo */
  .cards-slide{
    position:relative;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .cards-title{
    position:relative;
    color:#d88b1a;
    font-size:2.4em;
    font-weight:800;
    letter-spacing:2px;
    text-align:center;
  }
  .cards-grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4, minmax(200px,1fr));
    grid-auto-rows:220px;
    gap:20px;
    padding:20px;
    max-width:1300px;
    width:95%;
  }
  .card{
    perspective:800px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .5s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px;
    font-size:1.25em;
    font-weight:600;
    line-height:1.35;
    gap:10px;
  }
  .card-front{
    background:rgba(20,20,20,.9);
    color:#fff;
    border:1px solid rgba(255,255,255,.2);
  }
  .card-back{
    background:#1a7f37;
    color:#fff;
    transform:rotateY(180deg);
  }
  .card-back.no-validar{ background:#8e1519; }
  .card-back .verdict{ font-weight:800; font-size:1.35em; }
  .card-back .category{ font-size:1em; opacity:.9; }
</style>
</head>
<body>

  <div id="viewer"></div>
  <div id="version">v2.2.0</div>
  <div id="counter"></div>
  <div id="nav">
    <button id="prev-btn" class="nav-btn" title="Anterior">‹</button>
    <button id="next-btn" class="nav-btn" title="Siguiente">›</button>
  </div>
  <button id="fullscreen-btn" title="Pantalla completa">⛶</button>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

/*
  Lista de diapositivas. Cada elemento es un PDF o un video.
  Agregá tus archivos en assets/slides/ y sumalos acá en el orden que quieras.

  Ejemplo:
  { type: 'pdf',   src: 'assets/slides/01-intro.pdf' },
  { type: 'video', src: 'assets/slides/02-demo.mp4'  },
  { type: 'image', src: 'assets/slides/03-foto.webp' },
*/
const slides = [
  { type: 'image', src: 'assets/slides/UNO.gif' },
  { type: 'video', src: 'assets/slides/2.mp4' },
  { type: 'image', src: 'assets/slides/3.jpg' },
  { type: 'image', src: 'assets/slides/4.jpg' },
  { type: 'image', src: 'assets/slides/5.jpg' },
  { type: 'image', src: 'assets/slides/6.jpg' },
  { type: 'image', src: 'assets/slides/7.jpg' },
  { type: 'image', src: 'assets/slides/8.jpg' },
  {
    type: 'cards',
    bg: 'assets/slides/9.jpg',
    cards: [
      { front: '"No es para tanto" / "Podría ser peor"', validar:false, category:'Minimizar' },
      { front: '"Es fácil de solucionar, solo haz esto"', validar:false, category:'Minimizar' },
      { front: '"Yo también me he sentido mal y salí adelante"', validar:false, category:'Comparar' },
      { front: '"Piensa en tu familia" / "Eso es egoísta"', validar:false, category:'Sermonear (aumenta la culpa)' },
      { front: '"Entiendo que te sientas así, es una situación difícil"', validar:true, category:'Reconocer la emoción' },
      { front: '"Gracias por confiar en mí y contarme esto"', validar:true, category:'Agradecer la confianza' },
      { front: '"Estoy aquí contigo, no tienes que pasar esto solo/a"', validar:true, category:'Acompañar' },
      { front: '"¿Cómo te puedo ayudar? Cuéntame más"', validar:true, category:'Escuchar activamente' },
    ]
  },
  { type: 'image', src: 'assets/slides/10.jpg' },
  { type: 'image', src: 'assets/slides/11.jpg' },
  // { type: 'pdf',   src: 'assets/slides/presentacion.pdf' },
];

let current = 0;
const viewer = document.getElementById('viewer');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pdfCache = new Map();

async function renderPdf(src){
  let pdf = pdfCache.get(src);
  if(!pdf){
    pdf = await pdfjsLib.getDocument(src).promise;
    pdfCache.set(src, pdf);
  }
  const page = await pdf.getPage(1);
  const dpr = window.devicePixelRatio || 1;
  const baseViewport = page.getViewport({ scale: 1 });
  const fitScale = Math.min(
    viewer.clientWidth / baseViewport.width,
    viewer.clientHeight / baseViewport.height
  );
  const viewport = page.getViewport({ scale: fitScale * dpr });

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = (viewport.width / dpr) + 'px';
  canvas.style.height = (viewport.height / dpr) + 'px';
  viewer.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

async function render(){
  viewer.innerHTML = '';

  if(slides.length === 0){
    viewer.innerHTML = '<div id="empty-msg">No hay diapositivas cargadas todavía.<br>Agregalas en el array "slides" de index.html.</div>';
    counter.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  viewer.classList.toggle('with-bg', current !== 0);

  const item = slides[current];

  if(item.type === 'blank'){
    // sin contenido propio: solo se ve el fondo
  } else if(item.type === 'pdf'){
    await renderPdf(item.src);
  } else if(item.type === 'video'){
    const video = document.createElement('video');
    video.src = item.src;
    video.controls = true;
    video.addEventListener('click', ()=> video.classList.toggle('expanded'));
    viewer.appendChild(video);
  } else if(item.type === 'image'){
    const img = document.createElement('img');
    img.src = item.src;
    viewer.appendChild(img);
  } else if(item.type === 'cards'){
    const wrap = document.createElement('div');
    wrap.className = 'cards-slide';
    wrap.style.backgroundImage = `url('${item.bg}')`;

    const title = document.createElement('div');
    title.className = 'cards-title';
    title.textContent = 'INTERACTUEMOS';
    wrap.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    const shuffled = [...item.cards].sort(()=> Math.random() - 0.5);

    shuffled.forEach(c=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">${c.front}</div>
          <div class="card-face card-back ${c.validar ? '' : 'no-validar'}">
            <div class="verdict">${c.validar ? '✅ Validar' : '❌ No validar'}</div>
            <div class="category">${c.category}</div>
          </div>
        </div>`;
      card.addEventListener('click', ()=> card.classList.toggle('flipped'));
      grid.appendChild(card);
    });

    wrap.appendChild(grid);
    viewer.appendChild(wrap);
  }

  counter.textContent = `${current + 1} / ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

function goNext(){
  if(current < slides.length - 1){
    current++;
    render();
  }
}

function goPrev(){
  if(current > 0){
    current--;
    render();
  }
}

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

const fullscreenBtn = document.getElementById('fullscreen-btn');
fullscreenBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', ()=>{
  fullscreenBtn.textContent = document.fullscreenElement ? '×' : '⛶';
  fullscreenBtn.title = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

render();
</script>
</body>
</html>
