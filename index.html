<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentación</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
  }
  #viewer{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  #viewer.with-bg{
    background:#000 url('assets/fondo.gif') center/cover no-repeat;
  }
  #viewer img{
    width:100%;
    height:100%;
    border:none;
    object-fit:contain;
    background:#000;
  }
  #viewer canvas{
    max-width:100%;
    max-height:100%;
  }

  /* Video: centrado, tamaño moderado por defecto; al hacer clic ocupa
     toda la pantalla salvo el alto de las flechas de navegación */
  #viewer video{
    max-width:88%;
    max-height:78vh;
    border:none;
    object-fit:contain;
    background:#000;
    cursor:pointer;
    transition:max-width .2s ease, max-height .2s ease;
  }
  #viewer video.expanded{
    width:100vw;
    max-width:100vw;
    height:calc(100vh - 96px);
    max-height:calc(100vh - 96px);
  }
  #empty-msg{
    color:#8b949e;
    font-size:1.2em;
    text-align:center;
    padding:20px;
  }

  /* Versión de la página */
  #version{
    position:fixed;
    bottom:6px;
    left:8px;
    color:rgba(255,255,255,.35);
    font-size:10px;
    user-select:none;
    z-index:10;
  }

  /* Contador de diapositiva */
  #counter{
    position:fixed;
    bottom:24px;
    left:24px;
    color:#fff;
    background:rgba(0,0,0,.5);
    padding:6px 14px;
    border-radius:20px;
    font-size:14px;
    user-select:none;
    z-index:10;
  }

  /* Flechas de navegación, esquina inferior derecha, siempre sobre la diapositiva */
  #nav{
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    gap:10px;
    z-index:10;
  }
  .nav-btn{
    width:76px;
    height:50px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:1.6em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .1s;
  }
  .nav-btn:hover{ background:rgba(0,0,0,.9); }
  .nav-btn:active{ transform:scale(0.95); }
  .nav-btn:disabled{
    opacity:.55;
    cursor:default;
  }
  .nav-btn:disabled:hover{ background:rgba(0,0,0,.72); }

  /* Botón de pantalla completa, esquina superior derecha */
  #fullscreen-btn{
    position:fixed;
    top:16px;
    right:16px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:1.1em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:background .15s;
  }
  #fullscreen-btn:hover{ background:rgba(0,0,0,.9); }

  /* Tutorial animado (estilo videojuego) que indica para qué sirve cada botón */
  .tutorial-overlay{
    position:fixed;
    inset:0;
    z-index:30;
    background:rgba(0,0,0,.55);
  }
  .tutorial-highlight{
    position:fixed;
    border-radius:999px;
    border:3px solid #d88b1a;
    box-shadow:0 0 0 6px rgba(216,139,26,.25), 0 0 22px 6px rgba(216,139,26,.6);
    animation:tutorial-pulse 1.1s ease-in-out infinite;
    transition:top .4s ease, left .4s ease, width .4s ease, height .4s ease;
    pointer-events:none;
  }
  .tutorial-hand{
    position:fixed;
    font-size:2em;
    transform:translate(-50%, 0);
    animation:tutorial-tap 1.1s ease-in-out infinite;
    transition:top .4s ease, left .4s ease;
    pointer-events:none;
  }
  @keyframes tutorial-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  @keyframes tutorial-tap{
    0%,100%{ transform:translate(-50%, 0); }
    50%{ transform:translate(-50%, 8px); }
  }
  .tutorial-label{
    position:fixed;
    background:#111;
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:1.05em;
    font-weight:700;
    border:1px solid rgba(255,255,255,.25);
    transition:top .4s ease, left .4s ease;
    white-space:nowrap;
    pointer-events:none;
  }
  .tutorial-skip{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    padding:10px 22px;
    border-radius:20px;
    cursor:pointer;
    font-size:.95em;
  }
  .tutorial-skip:hover{ background:rgba(255,255,255,.22); }

  /* Diapositiva con juego de tarjetas sobre una foto de fondo */
  .cards-slide{
    position:relative;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .cards-title{
    position:relative;
    color:#d88b1a;
    font-size:2.4em;
    font-weight:800;
    letter-spacing:2px;
    text-align:center;
  }
  .cards-grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4, minmax(200px,1fr));
    grid-auto-rows:220px;
    gap:20px;
    padding:20px;
    max-width:1300px;
    width:95%;
  }
  .card{
    perspective:800px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .5s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px;
    font-size:1.25em;
    font-weight:600;
    line-height:1.35;
    gap:10px;
  }
  .card-front{
    background:rgba(20,20,20,.9);
    color:#fff;
    border:1px solid rgba(255,255,255,.2);
  }
  .card-back{
    background:#1a7f37;
    color:#fff;
    transform:rotateY(180deg);
  }
  .card-back.no-validar{ background:#8e1519; }
  .card-back .verdict{ font-weight:800; font-size:1.35em; }
  .card-back .category{ font-size:1em; opacity:.9; }

  /* Diapositiva de quiz "Mito o Realidad" */
  .quiz-slide{
    position:relative;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .quiz-box{
    position:relative;
    width:min(760px, 90vw);
    background:rgba(10,10,10,.88);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:40px;
    text-align:center;
    color:#fff;
  }
  .quiz-progress{
    font-size:.9em;
    color:#9aa1a8;
    margin-bottom:8px;
  }
  .quiz-title{
    color:#d88b1a;
    font-size:1.6em;
    font-weight:800;
    margin-bottom:20px;
    letter-spacing:1px;
  }
  .quiz-statement{
    font-size:1.6em;
    font-weight:600;
    line-height:1.4;
    margin-bottom:28px;
  }
  .quiz-buttons{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .quiz-btn{
    flex:1;
    min-width:180px;
    font-size:1.3em;
    font-weight:800;
    padding:20px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .quiz-btn:hover:not(:disabled){ background:rgba(255,255,255,.18); }
  .quiz-btn:active:not(:disabled){ transform:scale(.97); }
  .quiz-btn:disabled{ cursor:default; opacity:.6; }
  .quiz-btn.correct{ background:#1a7f37; border-color:#1a7f37; opacity:1; }
  .quiz-btn.wrong{ background:#8e1519; border-color:#8e1519; opacity:1; }
  .quiz-feedback{
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,.15);
  }
  .feedback-verdict{
    font-size:1.3em;
    font-weight:800;
    margin-bottom:10px;
  }
  .feedback-text{
    font-size:1.1em;
    line-height:1.5;
    margin-bottom:20px;
    color:#e6edf3;
  }
  .quiz-next, .quiz-restart{
    font-size:1.05em;
    font-weight:700;
    padding:12px 28px;
    border-radius:10px;
    border:none;
    background:#d88b1a;
    color:#0d1117;
    cursor:pointer;
  }
  .quiz-next:hover, .quiz-restart:hover{ filter:brightness(1.1); }
  .quiz-score{
    font-size:1.5em;
    font-weight:800;
    margin-bottom:24px;
  }
</style>
</head>
<body>

  <div id="viewer"></div>
  <div id="version">v3.2.0</div>
  <div id="counter"></div>
  <div id="nav">
    <button id="prev-btn" class="nav-btn" title="Anterior">‹</button>
    <button id="next-btn" class="nav-btn" title="Siguiente">›</button>
  </div>
  <button id="fullscreen-btn" title="Pantalla completa">⛶</button>

  <div id="tutorial" class="tutorial-overlay" hidden>
    <div id="tutorial-highlight" class="tutorial-highlight"></div>
    <div id="tutorial-hand" class="tutorial-hand">👆</div>
    <div id="tutorial-label" class="tutorial-label"></div>
    <button id="tutorial-skip" class="tutorial-skip">Saltar ▶</button>
  </div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

/*
  Lista de diapositivas. Cada elemento es un PDF o un video.
  Agregá tus archivos en assets/slides/ y sumalos acá en el orden que quieras.

  Ejemplo:
  { type: 'pdf',   src: 'assets/slides/01-intro.pdf' },
  { type: 'video', src: 'assets/slides/02-demo.mp4'  },
  { type: 'image', src: 'assets/slides/03-foto.webp' },
*/
const slides = [
  { type: 'image', src: 'assets/slides/1.jpg' },
  { type: 'video', src: 'assets/slides/2.mp4' },
  { type: 'image', src: 'assets/slides/2-3.jpg' },
  { type: 'image', src: 'assets/slides/2-31.jpg' },
  { type: 'image', src: 'assets/slides/2-32.jpg' },
  { type: 'image', src: 'assets/slides/3.jpg' },
  { type: 'image', src: 'assets/slides/4.jpg' },
  { type: 'image', src: 'assets/slides/5.jpg' },
  { type: 'image', src: 'assets/slides/6.jpg' },
  { type: 'image', src: 'assets/slides/7.jpg' },
  { type: 'image', src: 'assets/slides/8.jpg' },
  {
    type: 'cards',
    cards: [
      { front: '"No es para tanto" / "Podría ser peor"', validar:false, category:'Minimizar' },
      { front: '"Es fácil de solucionar, solo haz esto"', validar:false, category:'Minimizar' },
      { front: '"Yo también me he sentido mal y salí adelante"', validar:false, category:'Comparar' },
      { front: '"Piensa en tu familia" / "Eso es egoísta"', validar:false, category:'Sermonear (aumenta la culpa)' },
      { front: '"Entiendo que te sientas así, es una situación difícil"', validar:true, category:'Reconocer la emoción' },
      { front: '"Gracias por confiar en mí y contarme esto"', validar:true, category:'Agradecer la confianza' },
      { front: '"Estoy aquí contigo, no tienes que pasar esto solo/a"', validar:true, category:'Acompañar' },
      { front: '"¿Cómo te puedo ayudar? Cuéntame más"', validar:true, category:'Escuchar activamente' },
    ]
  },
  { type: 'image', src: 'assets/slides/10.jpg' },
  { type: 'image', src: 'assets/slides/11.jpg' },
  { type: 'image', src: 'assets/slides/12.jpg' },
  { type: 'image', src: 'assets/slides/13.jpg' },
  { type: 'image', src: 'assets/slides/14.jpg' },
  { type: 'image', src: 'assets/slides/15.jpg' },
  { type: 'image', src: 'assets/slides/16.jfif' },
  { type: 'image', src: 'assets/slides/16.jpg' },
  {
    type: 'quiz',
    title: 'MITO O REALIDAD',
    questions: [
      {
        statement: 'Preguntar directamente sobre el suicidio puede plantarle la idea a la persona.',
        answer: 'mito',
        explanation: 'Preguntar de forma directa y con cuidado no induce la idea; al contrario, permite que la persona se sienta escuchada y puede ser el primer paso para pedir ayuda.'
      },
      {
        statement: 'Una persona puede estar sonriendo y, aun así, estar sufriendo por dentro.',
        answer: 'realidad',
        explanation: 'Muchas personas ocultan su dolor detrás de una sonrisa. La apariencia externa no siempre refleja lo que alguien siente.'
      },
      {
        statement: 'Hablar de suicidio es solo una forma de buscar atención.',
        answer: 'mito',
        explanation: 'Minimizarlo así puede impedir que la persona reciba ayuda real. Toda mención al suicidio debe tomarse en serio.'
      },
      {
        statement: 'Si alguien dice que está pensando en suicidarse, hay que tomarlo en serio.',
        answer: 'realidad',
        explanation: 'Siempre hay que tomarlo en serio y actuar: escuchar sin juzgar y buscar apoyo profesional.'
      },
      {
        statement: 'El aumento en el consumo de alcohol puede ser una señal de alerta de suicidio.',
        answer: 'realidad',
        explanation: 'El consumo de sustancias en aumento es una de las señales de alerta reconocidas.'
      },
      {
        statement: 'Desprenderse de pertenencias importantes puede ser una señal de alerta de suicidio.',
        answer: 'realidad',
        explanation: 'Regalar o deshacerse de objetos valiosos suele ser una señal de que la persona se está despidiendo.'
      },
      {
        statement: 'Si alguien me confía que ha pensado en suicidarse, soy yo quien debe resolverlo.',
        answer: 'mito',
        explanation: 'No es responsabilidad de una sola persona resolverlo. Lo importante es escuchar, acompañar y conectar a la persona con ayuda profesional.'
      },
    ]
  },
  { type: 'image', src: 'assets/slides/17.jpg' },
  { type: 'image', src: 'assets/slides/19.jpg' },
  { type: 'image', src: 'assets/slides/20.jpg' },
  // { type: 'pdf',   src: 'assets/slides/presentacion.pdf' },
];

let current = 0;
const viewer = document.getElementById('viewer');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pdfCache = new Map();

async function renderPdf(src){
  let pdf = pdfCache.get(src);
  if(!pdf){
    pdf = await pdfjsLib.getDocument(src).promise;
    pdfCache.set(src, pdf);
  }
  const page = await pdf.getPage(1);
  const dpr = window.devicePixelRatio || 1;
  const baseViewport = page.getViewport({ scale: 1 });
  const fitScale = Math.min(
    viewer.clientWidth / baseViewport.width,
    viewer.clientHeight / baseViewport.height
  );
  const viewport = page.getViewport({ scale: fitScale * dpr });

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = (viewport.width / dpr) + 'px';
  canvas.style.height = (viewport.height / dpr) + 'px';
  viewer.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

function buildQuizSlide(item){
  const wrap = document.createElement('div');
  wrap.className = 'quiz-slide';
  if(item.bg){
    wrap.style.backgroundImage = `url('${item.bg}')`;
  }

  const heading = document.createElement('div');
  heading.className = 'cards-title';
  heading.textContent = 'INTERACTUEMOS';
  wrap.appendChild(heading);

  const content = document.createElement('div');
  wrap.appendChild(content);

  let qIndex = 0;
  let score = 0;
  let answered = false;

  function paint(){
    content.innerHTML = '';

    if(qIndex >= item.questions.length){
      const box = document.createElement('div');
      box.className = 'quiz-box';
      box.innerHTML = `
        <div class="quiz-title">${item.title || 'Mito o Realidad'}</div>
        <div class="quiz-score">Resultado: ${score} / ${item.questions.length}</div>
        <button class="quiz-restart">Volver a jugar</button>
      `;
      box.querySelector('.quiz-restart').addEventListener('click', ()=>{
        qIndex = 0;
        score = 0;
        answered = false;
        paint();
      });
      content.appendChild(box);
      return;
    }

    const q = item.questions[qIndex];
    const box = document.createElement('div');
    box.className = 'quiz-box';
    box.innerHTML = `
      <div class="quiz-progress">${qIndex + 1} / ${item.questions.length}</div>
      <div class="quiz-title">${item.title || 'Mito o Realidad'}</div>
      <div class="quiz-statement">${q.statement}</div>
      <div class="quiz-buttons">
        <button class="quiz-btn" data-choice="mito">MITO</button>
        <button class="quiz-btn" data-choice="realidad">REALIDAD</button>
      </div>
      <div class="quiz-feedback" hidden></div>
    `;

    const feedback = box.querySelector('.quiz-feedback');
    box.querySelectorAll('.quiz-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        const choice = btn.dataset.choice;
        const correct = choice === q.answer;
        if(correct) score++;

        box.querySelectorAll('.quiz-btn').forEach(b=>{
          b.disabled = true;
          if(b.dataset.choice === q.answer) b.classList.add('correct');
          else if(b === btn) b.classList.add('wrong');
        });

        feedback.hidden = false;
        feedback.innerHTML = `
          <div class="feedback-verdict">${correct ? '✔ ¡Correcto!' : '✘ Incorrecto'}</div>
          <div class="feedback-text">Es <strong>${q.answer.toUpperCase()}</strong>: ${q.explanation}</div>
          <button class="quiz-next">${qIndex + 1 < item.questions.length ? 'Siguiente' : 'Ver resultado'}</button>
        `;
        feedback.querySelector('.quiz-next').addEventListener('click', ()=>{
          qIndex++;
          answered = false;
          paint();
        });
      });
    });

    content.appendChild(box);
  }

  paint();
  return wrap;
}

async function render(){
  viewer.innerHTML = '';

  if(slides.length === 0){
    viewer.innerHTML = '<div id="empty-msg">No hay diapositivas cargadas todavía.<br>Agregalas en el array "slides" de index.html.</div>';
    counter.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  viewer.classList.toggle('with-bg', current !== 0);

  const item = slides[current];

  if(item.type === 'blank'){
    // sin contenido propio: solo se ve el fondo
  } else if(item.type === 'pdf'){
    await renderPdf(item.src);
  } else if(item.type === 'video'){
    const video = document.createElement('video');
    video.src = item.src;
    video.controls = true;
    video.addEventListener('click', ()=> video.classList.toggle('expanded'));
    viewer.appendChild(video);
  } else if(item.type === 'image'){
    const img = document.createElement('img');
    img.src = item.src;
    viewer.appendChild(img);
  } else if(item.type === 'cards'){
    const wrap = document.createElement('div');
    wrap.className = 'cards-slide';
    if(item.bg){
      wrap.style.backgroundImage = `url('${item.bg}')`;
    }

    const title = document.createElement('div');
    title.className = 'cards-title';
    title.textContent = 'INTERACTUEMOS';
    wrap.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    const shuffled = [...item.cards].sort(()=> Math.random() - 0.5);

    shuffled.forEach(c=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">${c.front}</div>
          <div class="card-face card-back ${c.validar ? '' : 'no-validar'}">
            <div class="verdict">${c.validar ? '✅ Validar' : '❌ No validar'}</div>
            <div class="category">${c.category}</div>
          </div>
        </div>`;
      card.addEventListener('click', ()=> card.classList.toggle('flipped'));
      grid.appendChild(card);
    });

    wrap.appendChild(grid);
    viewer.appendChild(wrap);
  } else if(item.type === 'quiz'){
    viewer.appendChild(buildQuizSlide(item));
  }

  counter.textContent = `${current + 1} / ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

function goNext(){
  if(current < slides.length - 1){
    current++;
    render();
  }
}

function goPrev(){
  if(current > 0){
    current--;
    render();
  }
}

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

const fullscreenBtn = document.getElementById('fullscreen-btn');
fullscreenBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', ()=>{
  fullscreenBtn.textContent = document.fullscreenElement ? '×' : '⛶';
  fullscreenBtn.title = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

/* ---- Tutorial animado: muestra para qué sirve cada botón ---- */
const tutorial = document.getElementById('tutorial');
const tutorialHighlight = document.getElementById('tutorial-highlight');
const tutorialHand = document.getElementById('tutorial-hand');
const tutorialLabel = document.getElementById('tutorial-label');
const tutorialSkip = document.getElementById('tutorial-skip');

function positionTutorialStep(el, text, labelAbove){
  const rect = el.getBoundingClientRect();
  const pad = 10;

  tutorialHighlight.style.width = (rect.width + pad * 2) + 'px';
  tutorialHighlight.style.height = (rect.height + pad * 2) + 'px';
  tutorialHighlight.style.left = (rect.left - pad) + 'px';
  tutorialHighlight.style.top = (rect.top - pad) + 'px';

  const cx = rect.left + rect.width / 2;

  if(labelAbove){
    tutorialHand.style.left = cx + 'px';
    tutorialHand.style.top = (rect.top - 46) + 'px';
    tutorialLabel.style.top = Math.max(10, rect.top - 96) + 'px';
  } else {
    tutorialHand.style.left = cx + 'px';
    tutorialHand.style.top = (rect.top + rect.height + 14) + 'px';
    tutorialLabel.style.top = (rect.top + rect.height + 60) + 'px';
  }

  tutorialLabel.textContent = text;
  tutorialLabel.style.left = Math.max(10, Math.min(cx - 100, window.innerWidth - 210)) + 'px';
}

function runTutorial(){
  const steps = [
    { el: prevBtn,       text: 'Diapositiva anterior',  above:true  },
    { el: nextBtn,       text: 'Siguiente diapositiva', above:true  },
    { el: fullscreenBtn, text: 'Pantalla completa',     above:false },
  ];
  let i = 0;
  let timer;

  function showStep(){
    if(i >= steps.length){ endTutorial(); return; }
    const s = steps[i];
    positionTutorialStep(s.el, s.text, s.above);
    i++;
    timer = setTimeout(showStep, 2200);
  }

  function endTutorial(){
    clearTimeout(timer);
    tutorial.hidden = true;
  }

  tutorialSkip.addEventListener('click', endTutorial);
  tutorial.addEventListener('click', (e)=>{
    if(e.target === tutorial) endTutorial();
  });

  tutorial.hidden = false;
  showStep();
}

render().then(()=> setTimeout(runTutorial, 800));
</script>
</body>
</html>
