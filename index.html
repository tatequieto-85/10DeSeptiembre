<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentación</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
  }
  #viewer{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  #viewer video,
  #viewer img{
    width:100%;
    height:100%;
    border:none;
    object-fit:contain;
    background:#000;
  }
  #viewer canvas{
    max-width:100%;
    max-height:100%;
  }
  #empty-msg{
    color:#8b949e;
    font-size:1.2em;
    text-align:center;
    padding:20px;
  }

  /* Versión de la página */
  #version{
    position:fixed;
    bottom:6px;
    left:8px;
    color:rgba(255,255,255,.35);
    font-size:10px;
    user-select:none;
    z-index:10;
  }

  /* Contador de diapositiva */
  #counter{
    position:fixed;
    bottom:24px;
    left:24px;
    color:#fff;
    background:rgba(0,0,0,.5);
    padding:6px 14px;
    border-radius:20px;
    font-size:14px;
    user-select:none;
    z-index:10;
  }

  /* Flechas de navegación, esquina inferior derecha, siempre sobre la diapositiva */
  #nav{
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    gap:10px;
    z-index:10;
  }
  .nav-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:1.4em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .1s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,.15); }
  .nav-btn:active{ transform:scale(0.92); }
  .nav-btn:disabled{
    opacity:.3;
    cursor:default;
  }
  .nav-btn:disabled:hover{ background:rgba(0,0,0,.55); }
</style>
</head>
<body>

  <div id="viewer"></div>
  <div id="version">v1.1.0</div>
  <div id="counter"></div>
  <div id="nav">
    <button id="prev-btn" class="nav-btn" title="Anterior">‹</button>
    <button id="next-btn" class="nav-btn" title="Siguiente">›</button>
  </div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

/*
  Lista de diapositivas. Cada elemento es un PDF o un video.
  Agregá tus archivos en assets/slides/ y sumalos acá en el orden que quieras.

  Ejemplo:
  { type: 'pdf',   src: 'assets/slides/01-intro.pdf' },
  { type: 'video', src: 'assets/slides/02-demo.mp4'  },
  { type: 'image', src: 'assets/slides/03-foto.webp' },
*/
const slides = [
  { type: 'image', src: 'assets/slides/UNO.webp' },
  // { type: 'pdf',   src: 'assets/slides/presentacion.pdf' },
  // { type: 'video', src: 'assets/slides/02-demo.mp4'  },
];

let current = 0;
const viewer = document.getElementById('viewer');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pdfCache = new Map();

async function renderPdf(src){
  let pdf = pdfCache.get(src);
  if(!pdf){
    pdf = await pdfjsLib.getDocument(src).promise;
    pdfCache.set(src, pdf);
  }
  const page = await pdf.getPage(1);
  const dpr = window.devicePixelRatio || 1;
  const baseViewport = page.getViewport({ scale: 1 });
  const fitScale = Math.min(
    viewer.clientWidth / baseViewport.width,
    viewer.clientHeight / baseViewport.height
  );
  const viewport = page.getViewport({ scale: fitScale * dpr });

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = (viewport.width / dpr) + 'px';
  canvas.style.height = (viewport.height / dpr) + 'px';
  viewer.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

async function render(){
  viewer.innerHTML = '';

  if(slides.length === 0){
    viewer.innerHTML = '<div id="empty-msg">No hay diapositivas cargadas todavía.<br>Agregalas en el array "slides" de index.html.</div>';
    counter.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  const item = slides[current];

  if(item.type === 'pdf'){
    await renderPdf(item.src);
  } else if(item.type === 'video'){
    const video = document.createElement('video');
    video.src = item.src;
    video.controls = true;
    viewer.appendChild(video);
  } else if(item.type === 'image'){
    const img = document.createElement('img');
    img.src = item.src;
    viewer.appendChild(img);
  }

  counter.textContent = `${current + 1} / ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

function goNext(){
  if(current < slides.length - 1){
    current++;
    render();
  }
}

function goPrev(){
  if(current > 0){
    current--;
    render();
  }
}

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

render();
</script>
</body>
</html>
